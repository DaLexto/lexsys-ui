# Lexsys GitHub label manifest (strict sync via github-label-sync).
# Namespaces: type/*, area/*, priority/*, status/*, meta/*, automation/*.

# --- area:* (monorepo scope) — shared color bfdbfe ---

- name: "area:cli"
  color: "bfdbfe"
  description: Changes to packages/cli

- name: "area:ui"
  color: "bfdbfe"
  description: Changes to packages/ui

- name: "area:tokens"
  color: "bfdbfe"
  description: Changes to packages/tokens

- name: "area:registry"
  color: "bfdbfe"
  description: Changes to packages/registry

- name: "area:docs"
  color: "bfdbfe"
  description: Changes to documentation

- name: "area:playground"
  color: "bfdbfe"
  description: Changes to apps/playground

- name: "area:repo"
  color: "bfdbfe"
  description: Changes to monorepo tooling, CI, config, or root files

- name: "area:agents"
  color: "bfdbfe"
  description: Changes to AGENTS.md, Cursor rules, or agent skills

# --- type:* (change kind) ---

- name: "type:feat"
  color: "4ade80"
  description: New functionality
  aliases:
    - enhancement

- name: "type:fix"
  color: "f87171"
  description: Bug fix
  aliases:
    - bug

- name: "type:docs"
  color: "60a5fa"
  description: Documentation-only change
  aliases:
    - documentation

- name: "type:test"
  color: "67e8f9"
  description: Adding or correcting tests

- name: "type:refactor"
  color: "c084fc"
  description: Internal restructure without intended behavior change

- name: "type:chore"
  color: "9ca3af"
  description: Routine maintenance

- name: "type:ci"
  color: "facc15"
  description: CI workflow changes

- name: "type:build"
  color: "fb923c"
  description: Build tooling or generated artifact wiring

# --- priority:* (issue triage) ---

- name: "priority:critical"
  color: "991b1b"
  description: Blocks release or core development
  aliases:
    - "priority:P0"

- name: "priority:high"
  color: "ea580c"
  description: High priority for the next milestone
  aliases:
    - "priority:P1"

- name: "priority:medium"
  color: "eab308"
  description: Normal priority
  aliases:
    - "priority:P2"

- name: "priority:low"
  color: "86efac"
  description: Low priority or nice-to-have
  aliases:
    - "priority:P3"

# --- status:* (workflow) ---

- name: "status:needs-triage"
  color: "fde68a"
  description: Needs review and classification

- name: "status:ready-for-review"
  color: "fed7aa"
  description: Ready for maintainer review

- name: "status:blocked"
  color: "374151"
  description: Blocked by another task or decision

- name: "status:in-progress"
  color: "e0f2fe"
  description: Work is actively happening

- name: "status:needs-info"
  color: "ddd6fe"
  description: Waiting for more information

# --- meta:* (cross-cutting) ---

- name: "meta:breaking-change"
  color: "7f1d1d"
  description: Contains breaking API, config, registry, or token changes

- name: "meta:release-train"
  color: "a5b4fc"
  description: Release train PR (dev to main, Version packages, sync from main)

- name: "meta:changeset"
  color: "ddd6fe"
  description: Changeset and changelog prep for an upcoming release

- name: "meta:good-first-issue"
  color: "bbf7d0"
  description: Good issue for new contributors
  aliases:
    - "good first issue"

- name: "meta:help-wanted"
  color: "bfdbfe"
  description: External help is welcome
  aliases:
    - "help wanted"

# --- automation:* (bots) ---

- name: "automation:dependencies"
  color: "60a5fa"
  description: Dependency update pull requests
  aliases:
    - dependencies

- name: "automation:github-actions"
  color: "facc15"
  description: GitHub Actions workflow or action updates
  aliases:
    - github_actions

# --- explicit deprecations (strict cleanup) ---

- name: duplicate
  color: "cfd3d7"
  delete: true

- name: invalid
  color: "e4e669"
  delete: true

- name: question
  color: "d876e3"
  delete: true

- name: wontfix
  color: "ffffff"
  delete: true

- name: javascript
  color: "168700"
  delete: true
