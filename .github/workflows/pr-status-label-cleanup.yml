name: PR status label cleanup

# Removes status:ready-for-review when a PR is merged so closed PRs stay tidy.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  remove-ready-for-review:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Remove status:ready-for-review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr edit "${{ github.event.pull_request.number }}"
          --repo "${{ github.repository }}"
          --remove-label "status:ready-for-review"
        continue-on-error: true
