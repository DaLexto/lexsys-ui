name: Sync dev from main

# Keeps dev in sync with Changesets release metadata on main (versions, changelogs).
# Opens a PR into dev (protected branch) and enables auto-merge when CI passes.
# See docs/operations/DEPLOY.md § Release workflow.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sync-dev-from-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: chore/sync-main-into-dev
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Open or update sync PR (main → dev)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev

          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already contains main — nothing to sync."
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH" origin/dev
          git merge origin/main --no-edit -m "chore(release): sync release metadata from main"

          git push origin "$SYNC_BRANCH" --force-with-lease

          PR_NUM="$(gh pr list --base dev --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUM" ]; then
            gh pr create --base dev --head "$SYNC_BRANCH" \
              --title "chore(release): sync release metadata from main" \
              --body "Automated sync after Release on \`main\`. Auto-merges when CI passes.

          Maintainer fallback: merge manually if auto-merge is disabled or checks fail."
            PR_NUM="$(gh pr list --base dev --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')"
          fi

          echo "Sync PR: #$PR_NUM"
          if ! gh pr merge "$PR_NUM" --auto --merge; then
            echo "::warning::Could not enable auto-merge on PR #$PR_NUM. Enable Allow auto-merge in repo Settings → General → Pull Requests, or merge manually."
          fi

      - name: Manual sync instructions
        if: failure()
        run: |
          echo "::error::Automatic sync failed (likely merge conflict). On your machine:"
          echo "git checkout dev && git pull origin dev && git merge origin/main"
          echo "Resolve conflicts, push dev, then re-run this workflow if needed."
